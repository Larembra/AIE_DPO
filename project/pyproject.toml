[project]
name = "detox-project"
version = "0.1.0"
description = "AI detoxification service with NLP + frontend and backend"
authors = [{ name = "Larembra" }]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
"torch",
"transformers",
"datasets",
"evaluate",
"scikit-learn",
"pandas",
"numpy",
"matplotlib",
"fastapi",
"uvicorn[standard]",
"pydantic",
"sqlalchemy",
"psycopg2-binary",
"python-dotenv",
"httpx",
"comet-ml"
]

[project.optional-dependencies]
dev = [
"pytest",
"black",
"ruff"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
